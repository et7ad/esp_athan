  # Push the current globals to the web/HA entities (only publishes what changed).
  # Runs from its own 1 s interval (see the bottom of the file) rather than inside update_display, so
  # the publish -> API/web callbacks always start from the shallow main-loop stack (ESP8266 has ~4 KB).
  # Format strings use PSTR/snprintf_P so they live in flash, not DRAM.
  - id: sync_web_state
    mode: restart
    then:
      - lambda: |-
          char buf[200];
          // Athan audio choice
          snprintf_P(buf, sizeof(buf), PSTR("Athan %d"), id(athan_file_index) - (${athan_file_first} - 1));
          if (id(web_athan_select).state != buf) id(web_athan_select).publish_state(buf);
          // Fajr athan choice
          if (id(fajr_athan_choice) >= 1 && id(fajr_athan_choice) <= 10) {
            snprintf_P(buf, sizeof(buf), PSTR("Fajr Athan %d"), id(fajr_athan_choice));
            if (id(web_fajr_athan_select).state != buf) id(web_fajr_athan_select).publish_state(buf);
          }
          // Hourly tick choice
          if (id(htick_file_index) == 0) snprintf_P(buf, sizeof(buf), PSTR("None"));
          else snprintf_P(buf, sizeof(buf), PSTR("Tick %d"), id(htick_file_index) - (${htick_file_first} - 1));
          if (id(web_htick_select).state != buf) id(web_htick_select).publish_state(buf);
          // Location
          {
            auto loc = id(web_location_select).at(id(selected_location_index));
            if (loc.has_value() && id(web_location_select).state != loc.value()) id(web_location_select).publish_state(loc.value());
          }
          // Volume, Fajr volume, tick window hours
          if (!id(web_volume).has_state() || (int) id(web_volume).state != id(volume_level)) id(web_volume).publish_state(id(volume_level));
          if (id(fajr_volume_level) >= 0 && (!id(web_fajr_volume).has_state() || (int) id(web_fajr_volume).state != id(fajr_volume_level))) id(web_fajr_volume).publish_state(id(fajr_volume_level));
          if (!id(web_htick_start).has_state() || (int) id(web_htick_start).state != id(htick_start_hour)) id(web_htick_start).publish_state(id(htick_start_hour));
          if (!id(web_htick_end).has_state() || (int) id(web_htick_end).state != id(htick_end_hour)) id(web_htick_end).publish_state(id(htick_end_hour));
          // 12 h / 24 h text formatter (display only; stored times stay 24 h)
          auto fmt_time = [&](char *out, size_t n, int h, int m) {
            if (id(clock_12h)) {
              int h12 = h % 12; if (h12 == 0) h12 = 12;
              snprintf_P(out, n, PSTR("%d:%02d %s"), h12, m, (h < 12) ? "AM" : "PM");
            } else {
              snprintf_P(out, n, PSTR("%02d:%02d"), h, m);
            }
          };
          char t1[12], t2[12];
          // Tick window text
          {
            int s = id(htick_start_hour), e = id(htick_end_hour);
            if (s == e) {
              snprintf_P(buf, sizeof(buf), PSTR("all day"));
            } else {
              fmt_time(t1, sizeof(t1), s, 0); fmt_time(t2, sizeof(t2), e, 0);
              snprintf_P(buf, sizeof(buf), PSTR("%s to %s (%d h)"), t1, t2, (e - s + 24) % 24);
            }
            if (id(web_htick_window).state != buf) id(web_htick_window).publish_state(buf);
          }
          // Next prayer and today's times
          static const char* prayer_names[7] = {"Fajr", "Sunrise", "Doha", "Dhuhr", "Asr", "Maghrib", "Isha"};
          auto now = id(sntp_time).now();
          if (now.is_valid() && id(prayer_times_refreshed_at_least_once)) {
            int npi = id(next_prayer_index);
            int total = id(next_prayer_hour) * 60 + id(next_prayer_minute) - (now.hour * 60 + now.minute);
            if (total < 0) total += 24 * 60;
            bool muted = (npi != 1 && npi != 2) && !id(athan_enabled)[npi];
            fmt_time(t1, sizeof(t1), id(next_prayer_hour), id(next_prayer_minute));
            snprintf_P(buf, sizeof(buf), PSTR("%s %s (in %dh %02dm)%s"), prayer_names[npi],
                       t1, total / 60, total % 60, muted ? " [athan off]" : "");
          } else {
            snprintf_P(buf, sizeof(buf), PSTR("waiting for time and prayer data"));
          }
          if (id(web_next_prayer).state != buf) id(web_next_prayer).publish_state(buf);
          if (id(prayer_times_refreshed_at_least_once)) {
            int pos = 0;
            for (int i = 0; i < 7 && pos < (int) sizeof(buf) - 1; i++) {
              fmt_time(t1, sizeof(t1), id(prayer_hours)[i], id(prayer_minutes)[i]);
              pos += snprintf_P(buf + pos, sizeof(buf) - pos, PSTR("%s%s %s"), (i == 0) ? "" : ", ", prayer_names[i], t1);
            }
          } else {
            snprintf_P(buf, sizeof(buf), PSTR("not loaded yet"));
          }
          if (id(web_today_times).state != buf) id(web_today_times).publish_state(buf);
          // Update status (also carries the firmware version)
          switch (id(update_check_state)) {
            case 1: snprintf_P(buf, sizeof(buf), PSTR("V%d up to date"), ${current_version}); break;
            case 2: snprintf_P(buf, sizeof(buf), PSTR("V%d -> V%d available, press Install Update"), ${current_version}, id(update_latest_version)); break;
            case 3: snprintf_P(buf, sizeof(buf), PSTR("V%d checking.."), ${current_version}); break;
            case 4: snprintf_P(buf, sizeof(buf), PSTR("V%d installing.."), ${current_version}); break;
            default: snprintf_P(buf, sizeof(buf), PSTR("V%d (press Check For Update)"), ${current_version}); break;
          }
          if (id(web_update_status).state != buf) id(web_update_status).publish_state(buf);

  - id: update_display
    mode: restart
    then:
      - lambda: |-
          // Never touch the OLED before its setup() has allocated the buffer (or if it failed).
          // A trigger firing during component setup would otherwise crash the ESP8266 (see CLAUDE.md).
          // Use is_ready(): a polling display has no loop(), so it stays in the SETUP state for ever
          // and is_in_loop_state()/is_idle() are never true for it (that blanked the screen once).
          if (!id(oled).is_ready()) return;
          id(oled).clear();
          auto now = id(sntp_time).now();
          if (!now.is_valid() && id(ui_mode)==0) {
            id(oled).line(0, 11, 127, 11); //crossline1
            id(oled).line(0, 33, 127, 33); //crossline2
            id(oled).line(0, 55, 127, 55); //crossline3
          }

          if (!id(prayer_times_refreshed_at_least_once) && id(ui_mode)==0) {
            id(oled).line(0, 33, 127, 33); //crossline2
            id(oled).line(0, 55, 127, 55); //crossline3
          }

          if (!WiFi.isConnected()){
            id(oled).circle(116, 52, 10);
            id(oled).printf(107, 41, id(font1), "W");
            id(oled).line(105, 43, 125, 63);
          }

          // Menu timeout: if menu active and no activity for >= 60s, exit menu
          if (id(ui_mode) != 0) {
            unsigned long last = id(ui_last_activity);
            if (last > 0) {
              unsigned long diff = millis() - last;
              if (diff >= 60000) {
                ESP_LOGI("ui", "Menu timed out after %lu ms, returning to normal", diff);
                if (id(ui_mode) == 8 || id(ui_mode) == 9) id(apply_volume).execute();
                id(ui_mode) = 0;
                id(dfp).stop();
                id(dfp_play).stop();
              }
            }
          }

          int hour = now.hour;
          int minute = now.minute;

          static const char* prayer_names[7] = {"Fajr", "Sunrise", "Doha", "Dhuhr", "Asr", "Maghrib", "Isha"};
          const char* next_prayer_name = prayer_names[id(next_prayer_index)];

          // Month abbreviations for compact date display (Jan, Feb, ...)
          static const char* months[12] = {"Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"};

          // ---- rendering helpers. 12h/24h is display-only: stored times stay 24 h everywhere. ----
          // Width of a time as draw_time() would print it (digits in font1, small AM/PM in font3 in 12 h mode).
          auto time_width = [&](int h, int m) -> int {
            char b[8]; int x1, y1, w = 0, w2 = 0, hh;
            if (id(clock_12h)) {
              int h12 = h % 12; if (h12 == 0) h12 = 12;
              snprintf(b, sizeof(b), "%d:%02d", h12, m);
              id(oled).get_text_bounds(0, 0, b, id(font1), display::TextAlign::TOP_LEFT, &x1, &y1, &w, &hh);
              id(oled).get_text_bounds(0, 0, (h < 12) ? "AM" : "PM", id(font3), display::TextAlign::TOP_LEFT, &x1, &y1, &w2, &hh);
              return w + 1 + w2;
            }
            snprintf(b, sizeof(b), "%02d:%02d", h, m);
            id(oled).get_text_bounds(0, 0, b, id(font1), display::TextAlign::TOP_LEFT, &x1, &y1, &w, &hh);
            return w;
          };
          // Prints a time with its top-left at (x, y); returns the x just after it.
          auto draw_time = [&](int x, int y, int h, int m) -> int {
            char b[8]; int x1, y1, w, hh;
            if (id(clock_12h)) {
              int h12 = h % 12; if (h12 == 0) h12 = 12;
              snprintf(b, sizeof(b), "%d:%02d", h12, m);
              id(oled).print(x, y, id(font1), b);
              id(oled).get_text_bounds(x, y, b, id(font1), display::TextAlign::TOP_LEFT, &x1, &y1, &w, &hh);
              x += w + 1;
              const char* ap = (h < 12) ? "AM" : "PM";
              id(oled).print(x, y + 9, id(font3), ap);   // font1 baseline 19, font3 baseline 10: +9 aligns them
              id(oled).get_text_bounds(x, y, ap, id(font3), display::TextAlign::TOP_LEFT, &x1, &y1, &w, &hh);
              return x + w;
            }
            snprintf(b, sizeof(b), "%02d:%02d", h, m);
            id(oled).print(x, y, id(font1), b);
            id(oled).get_text_bounds(x, y, b, id(font1), display::TextAlign::TOP_LEFT, &x1, &y1, &w, &hh);
            return x + w;
          };
          // Small padlock (buttons locked), top-left at (x, y), 7 px wide, 9 px tall. Drawn, not a glyph.
          auto draw_lock = [&](int x, int y) {
            id(oled).circle(x + 3, y + 2, 2);
            id(oled).filled_rectangle(x, y + 4, 7, 5);
          };
          // Small speaker icon, top-left at (x, y), 19 px wide, 16 px tall. Drawn, not a glyph: the OLED
          // font has no emoji (the old Volume line with an emoji rendered as a rectangle).
          auto draw_speaker = [&](int x, int y) {
            id(oled).filled_rectangle(x, y + 5, 4, 6);
            id(oled).filled_triangle(x + 4, y + 5, x + 9, y + 1, x + 9, y + 15);
            id(oled).filled_triangle(x + 4, y + 10, x + 9, y + 15, x + 4, y + 5);
            id(oled).line(x + 12, y + 5, x + 12, y + 10);
            id(oled).line(x + 15, y + 3, x + 15, y + 12);
            id(oled).line(x + 18, y + 1, x + 18, y + 14);
          };

          int total_mins_to_next = id(next_prayer_hour)*60 + id(next_prayer_minute) - (hour*60 + minute);
          if (total_mins_to_next < 0) total_mins_to_next += 24*60;
          int hrs = total_mins_to_next / 60;
          int mins = total_mins_to_next % 60;

          char line1[32];
          char line2[32];
          char line3[32];

          // If in menu, render concise menu/submenu UI
          if (id(ui_mode) != 0) {
            if (id(ui_mode) == 1) {
              // Main menu: first line fixed, second line shows current item
              static const char* menu_items[14] = {"Athan","Fajr Athan","Athan On/Off","Hourly Tick","Tick Window","Location","Update","Volume","Fajr Volume","Clock","Lock Buttons","Info","Cancel","Q"};
              id(oled).print(0, 0, id(font1), "Menu:");
              if (id(ui_menu_index) == 13) {
                snprintf(line2, sizeof(line2), "Q: %s", (id(q_flag) ? "ON" : "OFF"));
              } else if (id(ui_menu_index) == 9) {
                snprintf(line2, sizeof(line2), "Clock: %s", (id(clock_12h) ? "12h" : "24h"));
              } else {
                snprintf(line2, sizeof(line2), "%s", menu_items[id(ui_menu_index)]);
              }
              id(oled).print(0, 22, id(font1), line2);
              // When Update item selected, show version info on third row
              if (id(ui_menu_index) == 6) {
                if (id(update_check_state) == 0) {
                  // Not checked yet: show current version only
                  snprintf(line3, sizeof(line3), "V%d", ${current_version});
                } else if (id(update_check_state) == 3) {
                  snprintf(line3, sizeof(line3), "V%d checking..", ${current_version});
                } else if (id(update_check_state) == 1) {
                  snprintf(line3, sizeof(line3), "V%d uptodate", ${current_version});
                } else if (id(update_check_state) == 2) {
                  snprintf(line3, sizeof(line3), "V%d -> V%d ?", ${current_version}, id(update_latest_version));
                } else if (id(update_check_state) == 4) {
                  snprintf(line3, sizeof(line3), "attempting ..");
                } else {
                  snprintf(line3, sizeof(line3), "V%d", ${current_version});
                }
                id(oled).print(0, 44, id(font1), line3);
              }
            } else if (id(ui_mode) == 2) {
              snprintf(line1, sizeof(line1), "Athan:");
              id(oled).print(0, 0, id(font1), line1);
              snprintf(line2, sizeof(line2), "%d / 10", id(athan_index) + 1);
              snprintf(line3, sizeof(line3), "File: %d", ${athan_file_first} + id(athan_index));
              id(oled).print(0, 22, id(font1), line2);
              id(oled).print(0, 44, id(font1), line3);
            } else if (id(ui_mode) == 3) {
              snprintf(line1, sizeof(line1), "Hourly Tick:");
              id(oled).print(0, 0, id(font1), line1);
              if (id(htick_index) == 0) {
                snprintf(line2, sizeof(line2), "None");
              } else {
                snprintf(line2, sizeof(line2), "%d / 10", id(htick_index));
                snprintf(line3, sizeof(line3), "File: %d", (${htick_file_first} - 1) + id(htick_index));
              }
              id(oled).print(0, 22, id(font1), line2);
              if (id(htick_index) > 0) {
                id(oled).print(0, 44, id(font1), line3);
              }
            } else if (id(ui_mode) == 4) {
              // Location submenu: short header + location key (from the Location select's option list)
              id(oled).print(0, 0, id(font1), "Location:");
              auto loc = id(web_location_select).at(id(location_index));
              snprintf(line2, sizeof(line2), "%s", loc.has_value() ? loc.value().c_str() : "?");
              id(oled).print(0, 22, id(font1), line2);
            } else if (id(ui_mode) == 5) {
              // Volume submenu
              id(oled).print(0, 0, id(font1), "Volume");
              draw_speaker(76, 2);
              snprintf(line2, sizeof(line2), "%d%%", id(volume_level));
              id(oled).print(0, 22, id(font1), line2);
            } else if (id(ui_mode) == 8) {
              // Fajr Athan submenu: which Fajr-wording recording (F1..F10) plays at Fajr
              id(oled).print(0, 0, id(font1), "Fajr Athan:");
              snprintf(line2, sizeof(line2), "%d / 10", id(fajr_athan_index) + 1);
              snprintf(line3, sizeof(line3), "File: %d", ${fajr_file_first} + id(fajr_athan_index));
              id(oled).print(0, 22, id(font1), line2);
              id(oled).print(0, 44, id(font1), line3);
            } else if (id(ui_mode) == 9) {
              // Fajr Volume submenu (used for the Fajr athan and the Quyam audio). The header is too wide
              // for the icon (108 + 25 px > 128), so the speaker sits after the percentage on line 2.
              id(oled).print(0, 0, id(font1), "Fajr Volume");
              snprintf(line2, sizeof(line2), "%d%%", id(fajr_volume_level));
              id(oled).print(0, 22, id(font1), line2);
              {
                int x1, y1, w, h2;
                id(oled).get_text_bounds(0, 22, line2, id(font1), display::TextAlign::TOP_LEFT, &x1, &y1, &w, &h2);
                draw_speaker(w + 8, 24);
              }
            } else if (id(ui_mode) == 10 || id(ui_mode) == 11 || id(ui_mode) == 12) {
              // Tick Window: line 2 = selected entry (">" while editing), line 3 = resulting window width
              id(oled).print(0, 0, id(font1), "Tick Window");
              int s = id(htick_start_hour), e = id(htick_end_hour);
              int x1, y1, w, h2;
              if (id(ui_mode) == 11 || (id(ui_mode) == 10 && id(tickwin_index) == 0)) {
                const char* lbl = (id(ui_mode) == 11) ? "Start>" : "Start:";
                id(oled).print(0, 22, id(font1), lbl);
                id(oled).get_text_bounds(0, 22, lbl, id(font1), display::TextAlign::TOP_LEFT, &x1, &y1, &w, &h2);
                draw_time(w + 5, 22, s, 0);
              } else if (id(ui_mode) == 12 || (id(ui_mode) == 10 && id(tickwin_index) == 1)) {
                const char* lbl = (id(ui_mode) == 12) ? "End>" : "End:";
                id(oled).print(0, 22, id(font1), lbl);
                id(oled).get_text_bounds(0, 22, lbl, id(font1), display::TextAlign::TOP_LEFT, &x1, &y1, &w, &h2);
                draw_time(w + 5, 22, e, 0);
              } else {
                id(oled).print(0, 22, id(font1), "Done");
              }
              int width = (s == e) ? 24 : ((e - s + 24) % 24);
              snprintf(line3, sizeof(line3), "Window: %dh", width);
              id(oled).print(0, 44, id(font1), line3);
            } else if (id(ui_mode) == 6) {
              // Athan On/Off submenu
              static const char* mute_names[6] = {"Fajr", "Dhuhr", "Asr", "Maghrib", "Isha", "Done"};
              static const int mute_prayer_idx[5] = {0, 3, 4, 5, 6};
              id(oled).print(0, 0, id(font1), "Athan On/Off");
              if (id(mute_index) < 5) {
                snprintf(line2, sizeof(line2), "%s: %s", mute_names[id(mute_index)],
                         id(athan_enabled)[mute_prayer_idx[id(mute_index)]] ? "ON" : "OFF");
              } else {
                snprintf(line2, sizeof(line2), "Done");
              }
              id(oled).print(0, 22, id(font1), line2);
            } else if (id(ui_mode) == 7) {
              // Info screen: version, IP address (small font) and the mDNS name
              snprintf(line1, sizeof(line1), "Info  V%d", ${current_version});
              id(oled).print(0, 0, id(font1), line1);
              // Arduino-core call (WiFi.isConnected() is already used above); ESPHome's own getter names change between releases
              String ip = WiFi.isConnected() ? WiFi.localIP().toString() : String("no wifi");
              id(oled).print(0, 26, id(font2), ip.c_str());
              id(oled).print(0, 46, id(font2), "athan.local");
            }
            id(oled).display();
            return;
          }

          // Normal (not in menu) display — no seconds, update once per minute
          if (id(athan_playing)) {
            id(oled).print(0, 0, id(font1), "Athan Time:");
            snprintf(line1, sizeof(line1), "%s prayer", prayer_names[id(current_athan_prayer_index)]);
            id(oled).print(0, 22, id(font1), line1);
            // Time (+ small AM/PM in 12 h mode) and compact date; the gap shrinks if needed to fit 128 px
            {
              int x1, y1, wd, hd;
              snprintf(line3, sizeof(line3), "%02d%s", now.day_of_month, months[now.month - 1]);
              id(oled).get_text_bounds(0, 44, line3, id(font1), display::TextAlign::TOP_LEFT, &x1, &y1, &wd, &hd);
              int gap = 128 - time_width(hour, minute) - wd;
              if (gap > 10) gap = 10; if (gap < 2) gap = 2;
              int x = draw_time(0, 44, hour, minute);
              id(oled).print(x + gap, 44, id(font1), line3);
            }
          } else {
            // Line 1: time (+ small AM/PM in 12 h mode) and compact date; the gap shrinks if needed to fit 128 px
            {
              int x1, y1, wd, hd;
              snprintf(line1, sizeof(line1), "%02d%s", now.day_of_month, months[now.month - 1]);
              id(oled).get_text_bounds(0, 0, line1, id(font1), display::TextAlign::TOP_LEFT, &x1, &y1, &wd, &hd);
              int gap = 128 - time_width(hour, minute) - wd;
              if (gap > 10) gap = 10; if (gap < 2) gap = 2;
              int x = draw_time(0, 0, hour, minute);
              id(oled).print(x + gap, 0, id(font1), line1);
            }
            // Line 2: next prayer name and its time (same gap rule)
            {
              int x1, y1, wn, hn;
              id(oled).get_text_bounds(0, 22, next_prayer_name, id(font1), display::TextAlign::TOP_LEFT, &x1, &y1, &wn, &hn);
              int gap = 128 - wn - time_width(id(next_prayer_hour), id(next_prayer_minute));
              if (gap > 5) gap = 5; if (gap < 1) gap = 1;
              id(oled).print(0, 22, id(font1), next_prayer_name);
              draw_time(wn + gap, 22, id(next_prayer_hour), id(next_prayer_minute));
            }
            // Line 3: time remaining (a duration, so never 12 h formatted) + padlock when the buttons are locked
            snprintf(line3, sizeof(line3), "Rem %02d:%02d", hrs, mins);
            id(oled).print(0, 44, id(font1), line3);
            // Padlock in the bottom-right corner (last row 63, last column 127); when the Wi-Fi-down mark
            // occupies that corner the padlock moves just left of it so both stay visible.
            if (id(buttons_locked)) draw_lock(WiFi.isConnected() ? 121 : 96, 55);
            // Next prayer has its athan turned OFF: strike through the last two letters of its name only
            {
              int npi = id(next_prayer_index);
              bool is_main_prayer = (npi != 1 && npi != 2);
              if (is_main_prayer && !id(athan_enabled)[npi]) {
                int x1, y1, w_full, h_full, w_head, h_head;
                std::string name(next_prayer_name);
                std::string head = name.substr(0, name.size() - 2);
                id(oled).get_text_bounds(0, 22, name.c_str(), id(font1), display::TextAlign::TOP_LEFT, &x1, &y1, &w_full, &h_full);
                id(oled).get_text_bounds(0, 22, head.c_str(), id(font1), display::TextAlign::TOP_LEFT, &x1, &y1, &w_head, &h_head);
                int sy = 22 + h_full / 2 + 2;   // roughly mid-height of the lowercase letters
                id(oled).line(w_head, sy, w_full - 1, sy);
              }
            }
          }

          id(oled).display();

# ======================================================
# EVERY 1 SECOND — CLOCK TICK
# ======================================================
interval:
  - interval: 1s
    then:
      - lambda: |-
          auto now = id(sntp_time).now();
          if (!now.is_valid()) {
           return;
          }
          // Ensure persisted timezone is applied once when time becomes valid.
          if (!id(time_zone_changed_at_boot)) {
            ESP_LOGI("tz", "Applying persisted timezone from 1s tick: '%s'", id(selected_location_tz).c_str());
            id(sntp_time).set_timezone(id(selected_location_tz).c_str());
            id(sntp_time).update();
            id(time_zone_changed_at_boot) = true;
          }
          if (!id(prayer_times_refreshed_at_least_once)) {
            return;
          }
          int hour = now.hour;
          int minute = now.minute;

          int isha_h = id(prayer_hours)[6];
          int isha_min = id(prayer_minutes)[6];
          bool time_more_than_prayer = (hour > id(next_prayer_hour)) || (hour == id(next_prayer_hour) && minute >= id(next_prayer_minute));
          bool less_than_isha = (hour < isha_h) || (hour == isha_h && minute < isha_min);
          bool prayer_is_isha = id(next_prayer_index) == 6;
          
          if ( time_more_than_prayer && (prayer_is_isha || less_than_isha) ) {
              int pi = id(next_prayer_index);
              bool is_main_prayer = (pi != 1 && pi != 2);   // Sunrise (1) and Doha (2) never call the athan
              if (is_main_prayer && id(athan_enabled)[pi]) {
                id(current_athan_prayer_index) = pi;      // set before make_athan so it picks the Fajr file at Fajr
                id(make_athan).execute();
              } else if (is_main_prayer) {
                ESP_LOGI("prayer", "Athan for prayer index %d is OFF, staying quiet", pi);
              }
              ESP_LOGI("prayer", "Prayer time reached: index=%d!", pi);
              id(Jump_to_next_prayer).execute();
              id(update_display).execute();
          }
          if (id(q_flag)) {
            // Only trigger once per scheduled period
            if (!id(quyam_triggered)) {
              if (id(next_prayer_index) == 0 && hour == id(quyam_next_hour) && minute == id(quyam_next_minute)) {
                ESP_LOGI("quyam", "Quyam time reached -> marking triggered and executing run_quyam");
                id(quyam_triggered) = true;
                id(run_quyam).execute();
              }
            }
          }
  - interval: 1min
    then:
      - lambda: |-
          auto now = id(sntp_time).now();
          if (!now.is_valid()) {
           id(update_display).execute();
          }
          return;
  # Keep the web page / Home Assistant entities in step with the globals (publishes only on change).
  - interval: 1s
    then:
      - script.execute: sync_web_state
  # OLED hot-plug watchdog. The display is optional: if it is missing or dead at boot, the I2C probe in its
  # setup() marks it failed and everything else keeps running. Every 10 s this
  # sends a zero-length I2C write (an ACK probe).
  #  - Never initialised (failed at boot) and now answering: run ESPHome's setup. Its probe runs before
  #    the frame buffer is allocated, so a miss simply retries next tick and nothing leaks.
  #  - Was working, went away, came back: re-run ESPHome's setup() as well.
  #    The module must answer two probes in a row first (a freshly plugged module can ACK before it is
  #    fully awake). Each such setup() allocates a new 1 KB frame buffer and ESPHome never frees the old
  #    one, so only ONE in-place re-init is allowed per boot. After that a replugged display is ignored
  #    (logged) until the user restarts the device. The device itself NEVER restarts
  #    because of the display: the athan keeps working on the speaker with a dark screen.
  - interval: 10s
    then:
      - lambda: |-
          static bool oled_lost = false;
          static uint8_t oled_back_ticks = 0;
          static uint8_t oled_leaks = 0;          // setup() calls made while an old frame buffer already existed
          const uint8_t max_leaks = 1;            // one in-place re-init (1 KB) per boot, then leave it to the user
          bool ack = (id(oled).write(nullptr, 0) == i2c::ERROR_OK);
          if (id(oled).is_failed()) {
            if (ack) {
              ESP_LOGI("oled", "Display detected, initialising");
              id(oled).reset_to_construction_state();
              id(oled).call();
              if (!id(oled).is_failed()) id(update_display).execute();
            }
            return;
          }
          if (!ack) {
            if (!oled_lost) ESP_LOGW("oled", "Display stopped responding");
            oled_lost = true;
            oled_back_ticks = 0;
            return;
          }
          if (!oled_lost) return;
          if (++oled_back_ticks < 2) return;   // wait for a second consecutive ACK so the module has settled
          oled_lost = false;
          if (oled_leaks >= max_leaks) {
            ESP_LOGW("oled", "Display is back again but the one in-place re-init per boot is used up; restart the device to use the screen (athan keeps working)");
            return;
          }
          oled_leaks++;
          ESP_LOGI("oled", "Display is back, re-running its setup (last in-place re-init for this boot)");
          id(oled).setup();
          if (id(oled).is_failed()) {
            ESP_LOGW("oled", "Setup probe missed, will retry on the next tick");
          } else {
            id(update_display).execute();
          }