substitutions:
  current_version: "6"

  # ---------------------------------------------------------------
  # DFPlayer / SD-card file layout. The DFPlayer numbers files by the
  # order they were copied to the card (see README section 3.2 and
  # SDCard_files/cpy_script.sh). Change these together with the card.
  # ---------------------------------------------------------------
  athan_file_first: "1"    # A1..A10 -> files 1..10  regular athans   (choice k -> file k)
  htick_file_first: "11"   # B1..B10 -> files 11..20 hourly ticks     (tick t   -> file 10+t)
  tone_volume_file: "22"   # C2      -> volume feedback tone
  tone_click_file: "23"    # C3      -> menu click
  quyam_file_first: "25"   # D1..D10 -> files 25..34 Quyam audio (random pick)
  quyam_file_last: "34"
  fajr_file_first: "35"    # F1..F10 -> files 35..44 Fajr-wording athans (choice k -> file 34+k)
  # Z_fallback_1..4 -> files 45..48. Never referenced by number; must be copied LAST.

  # OLED orientation / contrast (the display: block reads these; change them here).
  oled_flip_x: "true"      # ESPHome default true; set both flips to false to rotate the screen 180 degrees
  oled_flip_y: "true"
  oled_contrast: "1.0"     # 0.0 .. 1.0
  oled_reset_pin: "16"     # GPIO16 to the module's RES pin if it has one (4-pin modules do not); pulsed by ESPHome at every setup

  # ---------------------------------------------------------------
  # NOTE for people just changing the OLED / SSD1306 display
  # ---------------------------------------------------------------
  # The display configuration are further down in this file under
  # the `display:` section with `platform: ssd1306_i2c`.
  #
  # Common things you may want to tweak:
  #   - I2C address: the line `address: ` can be changed between
  #     `0x3C` and `0x3D` depending on your model.
  #   - Orientation: set the `oled_flip_x` / `oled_flip_y`
  #     substitutions just below if your screen is mounted upside
  #     down or mirrored (to rotate 180° you usually flip both).
  #
  # You normally do NOT need to touch other parts of this file if
  # you only want to adapt the SSD1306 display.

esphome:
  name: athan
  friendly_name: athan
  on_boot:
    then:
      - lambda: |-
          ESP_LOGI("tz", "Applying saved timezone on boot: '%s'", id(selected_location_tz).c_str());
          id(sntp_time).set_timezone(id(selected_location_tz).c_str());
      - if:
          condition:
            and:
              - binary_sensor.is_on: ui_next
              - binary_sensor.is_on: ui_select
          then:
            - logger.log: "on resetting wifi"
            - wait_until:
                timeout: 5min
                condition:
                  wifi.connected:
            - lambda: |-
                wifi::global_wifi_component->clear_sta();
                wifi::global_wifi_component->save_wifi_sta("doesntexist", "passwordfornonetwork");
            - output.turn_off: led_output
            - delay: 1s
            - output.turn_on: led_output
            - delay: .5s
            - output.turn_off: led_output
            - delay: 1s
            - output.turn_on: led_output
            - delay: .5s
            - output.turn_off: led_output
            - logger.log: "resetting"
            - switch.turn_on: _restart
      # Hardware unlock for the button lock: power up holding exactly ONE of the two buttons.
      # (Both held is the Wi-Fi reset above, unchanged.)
      - if:
          condition:
            lambda: 'return id(buttons_locked) && (id(ui_next).state != id(ui_select).state);'
          then:
            - lambda: |-
                id(buttons_locked) = false;
                ESP_LOGI("ui", "Buttons unlocked (one button held at power-up)");
            - output.turn_on: led_output
            - delay: 150ms
            - output.turn_off: led_output
            - delay: 150ms
            - output.turn_on: led_output
            - delay: 150ms
            - output.turn_off: led_output
            - delay: 150ms
            - output.turn_on: led_output
            - delay: 150ms
            - output.turn_off: led_output
      - lambda: |-
          // First boot after the update: Fajr volume starts equal to the main volume.
          if (id(fajr_volume_level) < 0) {
            id(fajr_volume_level) = id(volume_level);
            ESP_LOGI("audio", "Fajr volume initialised to %d%% (from main volume)", id(fajr_volume_level));
          }
          if (id(fajr_athan_choice) < 1 || id(fajr_athan_choice) > 10) {
            id(fajr_athan_choice) = id(athan_file_index) - (${athan_file_first} - 1);
            ESP_LOGI("audio", "Fajr athan choice initialised to %d (same as the regular athan)", id(fajr_athan_choice));
          }
      # # # for testing with RPI:
      # - output.turn_off: gpio0_output
      # - delay: 200ms
      # - output.turn_on: gpio0_output 
      - delay: 3s                # cheap DFPlayer clones need 2-3 s after power before they listen
      - script.execute: update_display
      # The ESP8266 boot ROM prints its boot log on GPIO1 (the DFPlayer's RX line) at every reset; clones
      # read that as commands and may start playing. Two stops end that before the volume is set.
      - lambda: 'id(dfp).stop();'
      - delay: 500ms
      - lambda: 'id(dfp).stop();'
      - delay: 300ms
      - script.execute: apply_volume
      - delay: 100ms
      - output.turn_on: led_output
      - delay: 500ms
      - output.turn_off: led_output
      - delay: 500ms
      - output.turn_on: led_output
      - delay: 500ms
      - output.turn_off: led_output


esp8266:
  board: d1_mini
  restore_from_flash: true

logger:
  level: DEBUG
  baud_rate: 0

# Home Assistant native API. Through it Home Assistant gets every entity the web page has (athan and
# tick selects, volumes, per-prayer switches, tick window, lock, 12h clock, stop/refresh/update/restart
# buttons, next-prayer and status sensors, relay), usable in dashboards and automations.
# OPTIONAL: to free 4-6 KB of RAM and 9 flash-preference words, comment out these four lines. Nothing
# else in this file depends on them: the web page, the menu, OTA (menu, web page and ESPHome dashboard
# "Install") and the athan all keep working. What you lose: Home Assistant entirely,
# scripts/relay_control_native.py, and "Logs" in the ESPHome dashboard (network logs go through the
# API; the web page's own log stream is separate, see `web_server: log:`).
api:
  reboot_timeout: 0s
  encryption:
    key: "jAOYf5QQGoONCqGQnC7fwPhSeb/ZTUTlawp1Lvu63ZI="

# Built-in web page at http://athan.local (or http://<ip>). Everything the two buttons can do is exposed
# there as entities (see the select:/number:/switch:/button:/text_sensor: blocks below), and the same
# entities show up in Home Assistant. REST examples: README section 1.6.
web_server:
  # Version 3 page: grouped sections (see sorting_groups), icons and an uptime line. Known downside, accepted:
  # its firmware-upload form carries accept="application/octet-stream", so Safari on macOS greys out .bin
  # files; upload from Chrome, or from a terminal: curl -F "update=@firmware.bin" http://athan.local/update
  # (the version 2 page has no such filter but shows one flat alphabetical list).
  version: 3
  # Live log streaming to the web page is OFF to save memory and traffic on the ESP8266.
  # Set `log: true` to see the device log at the bottom of the web page.
  log: false
  sorting_groups:
    - id: grp_now
      name: "Now"
      sorting_weight: 10
    - id: grp_athan
      name: "Athan"
      sorting_weight: 20
    - id: grp_prayers
      name: "Athan On/Off per Prayer"
      sorting_weight: 30
    - id: grp_location
      name: "Location"
      sorting_weight: 40
    - id: grp_system
      name: "System"
      sorting_weight: 50

ota:
  - platform: esphome
    password: "016f3e8b522050971c70fa58dd26c640"
  - platform: http_request
  # The "OTA Update" file-upload form at the bottom of the web page (http://athan.local). captive_portal
  # auto-loads this platform anyway; it is listed explicitly so the form survives if captive_portal is
  # ever removed. Anyone on the Wi-Fi can flash the device through it, same as the menu update.
  # If your browser's file picker greys out the .bin (Safari on macOS), use Chrome or upload from a
  # terminal:  curl -F "update=@firmware.bin" http://athan.local/update
  - platform: web_server

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: "AthanFallbackHotspot"
    password: "athan404"
    ap_timeout: 2min
  on_connect:
    then:
      - logger.log: "WiFi connected!"
      - wait_until:
          timeout: 8s
          condition:
            lambda: 'return id(sntp_time).now().is_valid();'
      - script.execute: refresh_prayer_times_if_needed

captive_portal:

i2c:
  sda: GPIO4
  scl: GPIO5
  scan: true

uart:
  tx_pin: GPIO1
  rx_pin: GPIO3
  baud_rate: 9600

dfplayer:
  id: dfp

binary_sensor:
  - platform: gpio
    name: "ui_next"
    id: "ui_next"
    internal: true
    pin:
      number: GPIO14
      mode: INPUT_PULLUP
      inverted: true
    on_press:
      then:
        - lambda: |-
            id(ui_last_activity) = millis();
            if (id(buttons_locked)) {
              // Locked: the only thing a button does is silence whatever is playing
              ESP_LOGI("ui","Next pressed while locked -> silence only");
              id(silence_audio).execute();
              return;
            }
            // If not in menu, act as a silence button or toggle relay
            if (id(ui_mode) == 0) {
              if (id(athan_playing)) {
                ESP_LOGI("ui","Next pressed (normal) -> silence");
                id(silence_audio).execute();
                //// Run the test script when ui_next pressed in normal mode
                id(test_script).execute();
              } else {
                // Athan not playing – toggle external relay
                ESP_LOGI("ui","Next pressed (normal, idle) -> toggle relay");
                id(external_relay).toggle();
              }
              id(update_display).execute();
              return;
            }
            // In menu: move forward
            ESP_LOGI("ui","Next pressed (menu) -> forward");
            if (id(ui_mode) == 1) {
              id(ui_menu_index) = (id(ui_menu_index) + 1) % 14;
              // any navigation breaks consecutive select count for Q
              id(q_select_count) = 0;
              // If navigation lands on the Update item, reset its state
              if (id(ui_menu_index) == 6) {
                id(update_check_state) = 0;
              }
              // play navigation click only in main menu (not in Athan/Hourly Tick preview menus)
            } else if (id(ui_mode) == 2) {
              id(athan_index) = (id(athan_index) + 1) % 10;
              if (!id(athan_playing)) {
                id(dfp_pending_file) = ${athan_file_first} + id(athan_index);
                id(dfp_play).execute();
              }
            } else if (id(ui_mode) == 3) {
              id(htick_index) = (id(htick_index) + 1) % 11;
              if (id(htick_index) == 0) {
                id(dfp).stop();
                id(dfp_play).stop();
              } else {
                id(dfp_pending_file) = (${htick_file_first} - 1) + id(htick_index);
                id(dfp_play).execute();
              }
            } else if (id(ui_mode) == 4) {
              id(location_index) = (id(location_index) + 1) % (int) id(web_location_select).size();
            } else if (id(ui_mode) == 5) {
              // Volume submenu: decrement by 10%, wrap 10 -> 100
              int v = id(volume_level);
              if (v <= 10) {
                id(volume_level) = 100;
              } else {
                id(volume_level) = v - 10;
              }
              ESP_LOGI("ui", "Volume changed to %d%%", id(volume_level));
              id(apply_volume).execute();
              // Play feedback tone so user hears the change at new volume
              if (!id(athan_playing)) {
                id(dfp_pending_file) = ${tone_volume_file};
                id(dfp_play).execute();
              }
            } else if (id(ui_mode) == 6) {
              // Athan On/Off submenu: Fajr, Dhuhr, Asr, Maghrib, Isha, Done
              id(mute_index) = (id(mute_index) + 1) % 6;
            } else if (id(ui_mode) == 7) {
              // Info screen: nothing to cycle
            } else if (id(ui_mode) == 8) {
              // Fajr Athan submenu: next Fajr recording, previewed at the Fajr volume
              id(fajr_athan_index) = (id(fajr_athan_index) + 1) % 10;
              if (!id(athan_playing)) {
                id(dfp_pending_file) = ${fajr_file_first} + id(fajr_athan_index);
                id(dfp_play).execute();
              }
            } else if (id(ui_mode) == 9) {
              // Fajr Volume submenu: decrement by 10%, wrap 10 -> 100, hear the tone at that level
              int v = id(fajr_volume_level);
              id(fajr_volume_level) = (v <= 10) ? 100 : v - 10;
              ESP_LOGI("ui", "Fajr volume changed to %d%%", id(fajr_volume_level));
              id(apply_fajr_volume).execute();
              if (!id(athan_playing)) {
                id(dfp_pending_file) = ${tone_volume_file};
                id(dfp_play).execute();
              }
            } else if (id(ui_mode) == 10) {
              // Tick Window submenu: Start, End, Done
              id(tickwin_index) = (id(tickwin_index) + 1) % 3;
            } else if (id(ui_mode) == 11) {
              id(htick_start_hour) = (id(htick_start_hour) + 1) % 24;
            } else if (id(ui_mode) == 12) {
              id(htick_end_hour) = (id(htick_end_hour) + 1) % 24;
            }
            id(update_display).execute();

  - platform: gpio
    name: "ui_select"
    id: "ui_select"
    internal: true
    pin:
      number: GPIO12
      mode: INPUT_PULLUP
      inverted: true
    on_press:
      then:
        - lambda: |-
            id(ui_last_activity) = millis();
            if (id(buttons_locked)) {
              ESP_LOGI("ui","Select pressed while locked -> silence only");
              id(silence_audio).execute();
              return;
            }
            // If not in menu, enter main menu
            if (id(ui_mode) == 0) {
              if(id(athan_playing)){
                ESP_LOGI("ui","Select pressed -> silence athan");
                id(silence_audio).execute();
                return;
              }
              id(ui_mode) = 1; // main menu
              id(ui_menu_index) = 0;
              // Always reset update-check state when entering the menu
              id(update_check_state) = 0;
              ESP_LOGI("ui","Select pressed -> Entered menu: index=0");
              if (!id(athan_playing)) {
                id(dfp_pending_file) = ${tone_click_file};
                id(dfp_play).execute();
              }
              id(update_display).execute();
              return;
            }
            // If in menu, act as select/confirm
            ESP_LOGI("ui","Select pressed in menu index=%d", id(ui_menu_index));
            if (id(ui_mode) == 1) {
              // main menu: 0=athan,1=fajr athan,2=athan on/off,3=htick,4=tick window,5=location,6=update,7=volume,8=fajr volume,9=clock,10=lock,11=info,12=cancel,13=Q
              if (id(ui_menu_index) == 0) {
                id(ui_mode) = 2;
                id(athan_index) = id(athan_file_index) - ${athan_file_first};
                if (id(athan_index) < 0) id(athan_index) = 0;
                ESP_LOGI("ui","Entered Athan submenu (index=%d)", id(athan_index));
                if (!id(athan_playing)) {
                  id(dfp_pending_file) = ${athan_file_first} + id(athan_index);
                  id(dfp_play).execute();
                }
              } else if (id(ui_menu_index) == 1) {
                id(ui_mode) = 8; // Fajr Athan submenu (previews at the Fajr volume)
                id(fajr_athan_index) = id(fajr_athan_choice) - 1;
                if (id(fajr_athan_index) < 0 || id(fajr_athan_index) > 9) id(fajr_athan_index) = 0;
                ESP_LOGI("ui","Entered Fajr Athan submenu (index=%d)", id(fajr_athan_index));
                if (!id(athan_playing)) {
                  id(apply_fajr_volume).execute();
                  id(dfp_pending_file) = ${fajr_file_first} + id(fajr_athan_index);
                  id(dfp_play).execute();
                }
              } else if (id(ui_menu_index) == 2) {
                id(ui_mode) = 6; // Athan On/Off submenu
                id(mute_index) = 0;
                ESP_LOGI("ui","Entered Athan On/Off submenu");
                if (!id(athan_playing)) {
                  id(dfp_pending_file) = ${tone_click_file};
                  id(dfp_play).execute();
                }
              } else if (id(ui_menu_index) == 3) {
                id(ui_mode) = 3;
                if (id(htick_file_index) == 0) id(htick_index) = 0; else id(htick_index) = id(htick_file_index) - (${htick_file_first} - 1);
                ESP_LOGI("ui","Entered Hourly Tick submenu (index=%d)", id(htick_index));
                if (!id(athan_playing) && id(htick_index) > 0) {
                  id(dfp_pending_file) = (${htick_file_first} - 1) + id(htick_index);
                  id(dfp_play).execute();
                }
              } else if (id(ui_menu_index) == 4) {
                id(ui_mode) = 10; // Tick Window submenu
                id(tickwin_index) = 0;
                ESP_LOGI("ui","Entered Tick Window submenu");
                if (!id(athan_playing)) {
                  id(dfp_pending_file) = ${tone_click_file};
                  id(dfp_play).execute();
                }
              } else if (id(ui_menu_index) == 5) {
                id(ui_mode) = 4; // location menu
                // Initialize preview index from the persisted selection so the
                // menu opens at the last saved location. `location_index` is
                // preview-only while menu is open.
                id(location_index) = id(selected_location_index);
                ESP_LOGI("ui","Entered Location submenu (preview_index=%d)", id(location_index));
                id(dfp_pending_file) = ${tone_click_file};
                id(dfp_play).execute();
              } else if (id(ui_menu_index) == 6) {
                // Update: first press checks remote latest.json, second press confirms update
                id(dfp_pending_file) = ${tone_click_file};
                id(dfp_play).execute();
                if (id(update_check_state) == 2) {
                  // Previously found an update and user confirmed -> attempt update
                  id(update_check_state) = 4; // attempting
                  id(update_display).execute();
                  id(perform_update).execute();
                } else {
                  // Start checking remote latest.json
                  id(update_check_state) = 3; // checking
                  // Refresh the display immediately so the "checking.." text appears
                  id(update_display).execute();
                  id(check_update_remote).execute();
                  id(ui_mode) = 1; // stay in menu
                  ESP_LOGI("update", "Checking remote for latest version...");
                }
              } else if (id(ui_menu_index) == 7) {
                // Enter volume submenu
                id(ui_mode) = 5;
                ESP_LOGI("ui", "Entered Volume submenu (level=%d%%)", id(volume_level));
                if (!id(athan_playing)) {
                  id(dfp_pending_file) = ${tone_volume_file};
                  id(dfp_play).execute();
                }
              } else if (id(ui_menu_index) == 8) {
                // Enter Fajr Volume submenu (DFPlayer temporarily at the Fajr level so the tone previews it)
                id(ui_mode) = 9;
                ESP_LOGI("ui", "Entered Fajr Volume submenu (level=%d%%)", id(fajr_volume_level));
                id(apply_fajr_volume).execute();
                if (!id(athan_playing)) {
                  id(dfp_pending_file) = ${tone_volume_file};
                  id(dfp_play).execute();
                }
              } else if (id(ui_menu_index) == 9) {
                // Clock 24h/12h: toggles in place, stays in the menu
                id(clock_12h) = !id(clock_12h);
                ESP_LOGI("ui","Clock display -> %s", id(clock_12h) ? "12h" : "24h");
                if (!id(athan_playing)) {
                  id(dfp_pending_file) = ${tone_click_file};
                  id(dfp_play).execute();
                }
              } else if (id(ui_menu_index) == 10) {
                // Lock Buttons: lock and go home. Unlock from the web page or by powering up holding one button.
                id(buttons_locked) = true;
                id(ui_mode) = 0;
                ESP_LOGI("ui","Buttons locked from menu");
                if (!id(athan_playing)) {
                  id(dfp_pending_file) = ${tone_click_file};
                  id(dfp_play).execute();
                }
              } else if (id(ui_menu_index) == 11) {
                id(ui_mode) = 7; // Info screen
                ESP_LOGI("ui","Entered Info screen");
                if (!id(athan_playing)) {
                  id(dfp_pending_file) = ${tone_click_file};
                  id(dfp_play).execute();
                }
              } else if (id(ui_menu_index) == 12) {
                // Cancel
                id(dfp_pending_file) = ${tone_click_file};
                id(dfp_play).execute();
                id(ui_mode) = 0;
                ESP_LOGI("ui","Menu cancelled");
              } else if (id(ui_menu_index) == 13) {
                // Q toggle item: enabling requires 10 consecutive select presses
                id(dfp_pending_file) = ${tone_click_file};
                id(dfp_play).execute();
                if (!id(q_flag)) {
                  id(q_select_count) = id(q_select_count) + 1;
                  ESP_LOGI("ui","Q select count = %d", id(q_select_count));
                  if (id(q_select_count) >= 10) {
                    id(q_flag) = true;
                    id(q_select_count) = 0;
                    ESP_LOGI("ui","Q enabled via 10 presses");
                  }
                } else {
                  // Q is on: a single press turns it off
                  id(q_flag) = false;
                  id(q_select_count) = 0;
                  ESP_LOGI("ui","Q disabled via single press");
                }
              } else {
                id(dfp_pending_file) = ${tone_click_file};
                id(dfp_play).execute();
                id(ui_mode) = 0;
              }
            } else if (id(ui_mode) == 2) {
              // select athan
              id(athan_file_index) = ${athan_file_first} + id(athan_index);
              id(dfp).stop();
              id(dfp_pending_file) = ${tone_click_file};
              id(dfp_play).execute();
              id(ui_mode) = 0;
              ESP_LOGI("ui","Athan %d selected", id(athan_file_index));
            } else if (id(ui_mode) == 3) {
              // select htick (0 = None)
              if (id(htick_index) == 0) id(htick_file_index) = 0; else id(htick_file_index) = (${htick_file_first} - 1) + id(htick_index);
              id(dfp).stop();
              id(dfp_pending_file) = ${tone_click_file};
              id(dfp_play).execute();
              id(ui_mode) = 0;
              ESP_LOGI("ui","Hourly Tick %d selected", id(htick_file_index));
            } else if (id(ui_mode) == 4) {
                id(dfp_pending_file) = ${tone_click_file};
                id(dfp_play).execute();
                if (id(location_index) != id(selected_location_index)) {
                  // apply the change only if the fetch returns a valid TZ.
                  id(change_location_handler).execute();
                } else {
                  id(ui_mode) = 0;
                }
            } else if (id(ui_mode) == 5) {
              // confirm volume selection
              ESP_LOGI("ui", "Volume selected: %d%%", id(volume_level));
              id(dfp_pending_file) = ${tone_click_file};
              id(dfp_play).execute();
              id(ui_mode) = 0;
            } else if (id(ui_mode) == 6) {
              // Athan On/Off submenu: toggle the shown prayer, or Done
              static const int mute_prayer_idx[5] = {0, 3, 4, 5, 6};   // Fajr, Dhuhr, Asr, Maghrib, Isha
              if (!id(athan_playing)) {
                id(dfp_pending_file) = ${tone_click_file};
                id(dfp_play).execute();
              }
              if (id(mute_index) < 5) {
                int p = mute_prayer_idx[id(mute_index)];
                id(athan_enabled)[p] = !id(athan_enabled)[p];
                ESP_LOGI("ui","Athan for prayer index %d -> %s", p, id(athan_enabled)[p] ? "ON" : "OFF");
              } else {
                id(ui_mode) = 0;
                ESP_LOGI("ui","Athan On/Off done");
              }
            } else if (id(ui_mode) == 7) {
              // Info screen: Select exits
              if (!id(athan_playing)) {
                id(dfp_pending_file) = ${tone_click_file};
                id(dfp_play).execute();
              }
              id(ui_mode) = 0;
            } else if (id(ui_mode) == 8) {
              // select Fajr athan, put the DFPlayer back to the main volume
              id(fajr_athan_choice) = 1 + id(fajr_athan_index);
              id(dfp).stop();
              id(apply_volume).execute();
              id(dfp_pending_file) = ${tone_click_file};
              id(dfp_play).execute();
              id(ui_mode) = 0;
              ESP_LOGI("ui","Fajr athan %d selected", id(fajr_athan_choice));
            } else if (id(ui_mode) == 9) {
              // confirm Fajr volume, put the DFPlayer back to the main volume
              ESP_LOGI("ui", "Fajr volume selected: %d%%", id(fajr_volume_level));
              id(apply_volume).execute();
              id(dfp_pending_file) = ${tone_click_file};
              id(dfp_play).execute();
              id(ui_mode) = 0;
            } else if (id(ui_mode) == 10) {
              // Tick Window submenu: Start -> edit start, End -> edit end, Done -> exit
              if (!id(athan_playing)) {
                id(dfp_pending_file) = ${tone_click_file};
                id(dfp_play).execute();
              }
              if (id(tickwin_index) == 0) id(ui_mode) = 11;
              else if (id(tickwin_index) == 1) id(ui_mode) = 12;
              else { id(ui_mode) = 0; ESP_LOGI("ui","Tick window: %02d-%02d", id(htick_start_hour), id(htick_end_hour)); }
            } else if (id(ui_mode) == 11 || id(ui_mode) == 12) {
              // confirm the edited hour, back to the Tick Window submenu
              if (!id(athan_playing)) {
                id(dfp_pending_file) = ${tone_click_file};
                id(dfp_play).execute();
              }
              id(ui_mode) = 10;
            }
            id(update_display).execute();

  # Web / Home Assistant: is the athan (or a preview) playing right now
  - platform: template
    name: "Athan Playing"
    id: web_athan_playing
    icon: "mdi:volume-high"
    lambda: return id(athan_playing);
    web_server:
      sorting_group_id: grp_now
      sorting_weight: 2

# External relay switch (exposed to Home Assistant and the web page)
switch:
  - platform: gpio
    id: external_relay
    name: "External Relay"
    pin: GPIO13
    restore_mode: RESTORE_DEFAULT_OFF
    web_server:
      sorting_group_id: grp_system
      sorting_weight: 5
  - platform: restart
    id: _restart
    internal: true

  # Per-prayer athan ON/OFF (same flags the "Athan On/Off" menu toggles).
  # restore_mode MUST stay DISABLED: with any other mode ESPHome calls turn_off() during setup, which
  # (a) forced every prayer OFF at each boot and (b) ran update_display before the OLED buffer existed,
  # crashing the ESP8266 on every boot (the V6 boot loop of 2026-09-10). The state comes from the lambda.
  - platform: template
    name: "Fajr Athan"
    id: web_athan_fajr
    icon: "mdi:bell-ring"
    restore_mode: DISABLED
    lambda: return id(athan_enabled)[0];
    turn_on_action:
      - lambda: |-
          id(athan_enabled)[0] = true;
          id(update_display).execute();
    turn_off_action:
      - lambda: |-
          id(athan_enabled)[0] = false;
          id(update_display).execute();
    web_server:
      sorting_group_id: grp_prayers
      sorting_weight: 1
  - platform: template
    name: "Dhuhr Athan"
    id: web_athan_dhuhr
    icon: "mdi:bell-ring"
    restore_mode: DISABLED
    lambda: return id(athan_enabled)[3];
    turn_on_action:
      - lambda: |-
          id(athan_enabled)[3] = true;
          id(update_display).execute();
    turn_off_action:
      - lambda: |-
          id(athan_enabled)[3] = false;
          id(update_display).execute();
    web_server:
      sorting_group_id: grp_prayers
      sorting_weight: 2
  - platform: template
    name: "Asr Athan"
    id: web_athan_asr
    icon: "mdi:bell-ring"
    restore_mode: DISABLED
    lambda: return id(athan_enabled)[4];
    turn_on_action:
      - lambda: |-
          id(athan_enabled)[4] = true;
          id(update_display).execute();
    turn_off_action:
      - lambda: |-
          id(athan_enabled)[4] = false;
          id(update_display).execute();
    web_server:
      sorting_group_id: grp_prayers
      sorting_weight: 3
  - platform: template
    name: "Maghrib Athan"
    id: web_athan_maghrib
    icon: "mdi:bell-ring"
    restore_mode: DISABLED
    lambda: return id(athan_enabled)[5];
    turn_on_action:
      - lambda: |-
          id(athan_enabled)[5] = true;
          id(update_display).execute();
    turn_off_action:
      - lambda: |-
          id(athan_enabled)[5] = false;
          id(update_display).execute();
    web_server:
      sorting_group_id: grp_prayers
      sorting_weight: 4
  - platform: template
    name: "Isha Athan"
    id: web_athan_isha
    icon: "mdi:bell-ring"
    restore_mode: DISABLED
    lambda: return id(athan_enabled)[6];
    turn_on_action:
      - lambda: |-
          id(athan_enabled)[6] = true;
          id(update_display).execute();
    turn_off_action:
      - lambda: |-
          id(athan_enabled)[6] = false;
          id(update_display).execute();
    web_server:
      sorting_group_id: grp_prayers
      sorting_weight: 5

  # The advanced "Q" flag is deliberately NOT exposed on the web page or Home Assistant;
  # it can only be changed from the device menu (10 consecutive Select presses to enable).

  # Child lock for the two physical buttons (same flag as the "Lock Buttons" menu item). While locked a
  # button press only silences audio. Hardware unlock: power up holding exactly one button.
  - platform: template
    name: "Buttons Locked"
    id: web_buttons_locked
    icon: "mdi:lock"
    restore_mode: DISABLED
    lambda: return id(buttons_locked);
    turn_on_action:
      - lambda: |-
          id(buttons_locked) = true;
          id(ui_mode) = 0;
          ESP_LOGI("web", "Buttons locked from web");
          id(update_display).execute();
    turn_off_action:
      - lambda: |-
          id(buttons_locked) = false;
          ESP_LOGI("web", "Buttons unlocked from web");
          id(update_display).execute();
    web_server:
      sorting_group_id: grp_now
      sorting_weight: 5
  # 12-hour clock on the OLED and in the web texts (display only; stored times stay 24 h)
  - platform: template
    name: "12-hour Clock"
    id: web_clock_12h
    icon: "mdi:clock-time-four-outline"
    restore_mode: DISABLED
    lambda: return id(clock_12h);
    turn_on_action:
      - lambda: |-
          id(clock_12h) = true;
          id(update_display).execute();
    turn_off_action:
      - lambda: |-
          id(clock_12h) = false;
          id(update_display).execute();
    web_server:
      sorting_group_id: grp_now
      sorting_weight: 6

# ======================================================
# WEB PAGE / HOME ASSISTANT CONTROLS
# Each entity below reuses the same scripts and globals the buttons use.
# ======================================================
select:
  - platform: template
    name: "Athan Audio"
    id: web_athan_select
    icon: "mdi:music"
    options: ["Athan 1", "Athan 2", "Athan 3", "Athan 4", "Athan 5", "Athan 6", "Athan 7", "Athan 8", "Athan 9", "Athan 10"]
    set_action:
      - lambda: |-
          auto idx = id(web_athan_select).index_of(x);
          if (!idx.has_value()) return;
          id(athan_file_index) = ${athan_file_first} + (int) idx.value();
          id(web_athan_select).publish_state(x);
          ESP_LOGI("web", "Athan choice %d selected", (int) idx.value() + 1);
          if (!id(athan_playing)) {
            id(dfp_pending_file) = id(athan_file_index);
            id(web_preview).execute();
          }
    web_server:
      sorting_group_id: grp_athan
      sorting_weight: 1
  - platform: template
    name: "Fajr Athan Audio"
    id: web_fajr_athan_select
    web_server:
      sorting_group_id: grp_athan
      sorting_weight: 1.5
    icon: "mdi:weather-sunset-up"
    options: ["Fajr Athan 1", "Fajr Athan 2", "Fajr Athan 3", "Fajr Athan 4", "Fajr Athan 5", "Fajr Athan 6", "Fajr Athan 7", "Fajr Athan 8", "Fajr Athan 9", "Fajr Athan 10"]
    set_action:
      - lambda: |-
          auto idx = id(web_fajr_athan_select).index_of(x);
          if (!idx.has_value()) return;
          id(fajr_athan_choice) = 1 + (int) idx.value();
          id(web_fajr_athan_select).publish_state(x);
          ESP_LOGI("web", "Fajr athan choice %d selected", id(fajr_athan_choice));
          if (!id(athan_playing)) {
            id(apply_fajr_volume).execute();
            id(dfp_pending_file) = (${fajr_file_first} - 1) + id(fajr_athan_choice);
            id(web_preview).execute();
          }
  - platform: template
    name: "Hourly Tick"
    id: web_htick_select
    icon: "mdi:bell-outline"
    options: ["None", "Tick 1", "Tick 2", "Tick 3", "Tick 4", "Tick 5", "Tick 6", "Tick 7", "Tick 8", "Tick 9", "Tick 10"]
    set_action:
      - lambda: |-
          auto idx = id(web_htick_select).index_of(x);
          if (!idx.has_value()) return;
          int t = (int) idx.value();   // 0 = None
          id(htick_file_index) = (t == 0) ? 0 : (${htick_file_first} - 1) + t;
          id(web_htick_select).publish_state(x);
          ESP_LOGI("web", "Hourly tick %d selected (file %d)", t, id(htick_file_index));
          if (!id(athan_playing)) {
            if (t == 0) {
              id(dfp).stop();
              id(dfp_play).stop();
            } else {
              id(dfp_pending_file) = id(htick_file_index);
              id(web_preview).execute();
            }
          }
    web_server:
      sorting_group_id: grp_athan
      sorting_weight: 3
  - platform: template
    name: "Location"
    id: web_location_select
    icon: "mdi:map-marker"
    # SINGLE SOURCE OF TRUTH for location keys (used to build the JSON URLs and by the Location menu).
    # Each label must equal the folder name docs/athantimes/<key>/ and the file docs/timezones/<key>.json.
    # NEVER insert or reorder entries: selected_location_index is persisted on every deployed device.
    # Only replace the masjidN placeholders.
    options: ["davis", "sclaramca", "sclaraalnoor", "sacramento", "cairo", "woodland", "masjid7", "masjid8", "masjid9", "masjid10", "masjid11", "masjid12", "masjid13", "masjid14", "masjid15"]
    set_action:
      - lambda: |-
          auto idx = id(web_location_select).index_of(x);
          if (!idx.has_value()) return;
          if ((int) idx.value() == id(selected_location_index)) {
            id(web_location_select).publish_state(x);
            return;
          }
          if (id(ui_mode) == 4) {
            ESP_LOGW("web", "Location submenu is open on the device, ignoring web change");
            return;
          }
          id(location_index) = (int) idx.value();
          ESP_LOGI("web", "Location '%s' requested, fetching timezone", x.c_str());
          id(change_location_handler).execute();
    web_server:
      sorting_group_id: grp_location
      sorting_weight: 1

number:
  - platform: template
    name: "Volume"
    id: web_volume
    icon: "mdi:volume-medium"
    unit_of_measurement: "%"
    min_value: 0
    max_value: 100
    step: 10
    mode: slider
    set_action:
      - lambda: |-
          int v = (int) (x + 0.5f);
          v = ((v + 5) / 10) * 10;
          if (v < 0) v = 0; if (v > 100) v = 100;
          id(volume_level) = v;
          id(apply_volume).execute();
          id(web_volume).publish_state(v);
          if (!id(athan_playing)) {
            id(dfp_pending_file) = ${tone_volume_file};
            id(dfp_play).execute();
          }
    web_server:
      sorting_group_id: grp_athan
      sorting_weight: 4
  - platform: template
    name: "Fajr Volume"
    id: web_fajr_volume
    icon: "mdi:volume-medium"
    unit_of_measurement: "%"
    min_value: 0
    max_value: 100
    step: 10
    mode: slider
    set_action:
      - lambda: |-
          int v = (int) (x + 0.5f);
          v = ((v + 5) / 10) * 10;
          if (v < 0) v = 0; if (v > 100) v = 100;
          id(fajr_volume_level) = v;
          id(web_fajr_volume).publish_state(v);
          ESP_LOGI("web", "Fajr volume set to %d%%", v);
          id(fajr_volume_feedback).execute();
    web_server:
      sorting_group_id: grp_athan
      sorting_weight: 4.5
  # Hourly tick active window: the tick plays at HH:00 only for hours in [start, end). Start == End = all day.
  - platform: template
    name: "Tick Window Start"
    id: web_htick_start
    icon: "mdi:clock-start"
    unit_of_measurement: "h"
    min_value: 0
    max_value: 23
    step: 1
    mode: slider
    set_action:
      - lambda: |-
          int v = (int) (x + 0.5f);
          if (v < 0) v = 0; if (v > 23) v = 23;
          id(htick_start_hour) = v;
          id(web_htick_start).publish_state(v);
          id(update_display).execute();
    web_server:
      sorting_group_id: grp_athan
      sorting_weight: 3.2
  - platform: template
    name: "Tick Window End"
    id: web_htick_end
    icon: "mdi:clock-end"
    unit_of_measurement: "h"
    min_value: 0
    max_value: 23
    step: 1
    mode: slider
    set_action:
      - lambda: |-
          int v = (int) (x + 0.5f);
          if (v < 0) v = 0; if (v > 23) v = 23;
          id(htick_end_hour) = v;
          id(web_htick_end).publish_state(v);
          id(update_display).execute();
    web_server:
      sorting_group_id: grp_athan
      sorting_weight: 3.4

button:
  - platform: template
    name: "Stop Audio"
    id: web_stop
    icon: "mdi:volume-off"
    on_press:
      - script.execute: silence_audio
    web_server:
      sorting_group_id: grp_now
      sorting_weight: 1
  - platform: template
    name: "Refresh Prayer Times"
    id: web_refresh_times
    icon: "mdi:refresh"
    on_press:
      - lambda: |-
          id(prayer_times_day) = -1;
          id(loaded_prayer_times_once) = false;
          id(prayer_times_refreshed_at_least_once) = false;
          id(refresh_prayer_times_if_needed).execute();
    web_server:
      sorting_group_id: grp_location
      sorting_weight: 2
  - platform: template
    name: "Check For Update"
    id: web_check_update
    icon: "mdi:update"
    on_press:
      - lambda: |-
          if (id(update_check_state) == 3 || id(update_check_state) == 4) return;
          id(update_check_state) = 3;
          id(update_display).execute();
          id(check_update_remote).execute();
    web_server:
      sorting_group_id: grp_system
      sorting_weight: 1
  - platform: template
    name: "Install Update"
    id: web_install_update
    icon: "mdi:download"
    on_press:
      - lambda: |-
          if (id(update_check_state) != 2) {
            ESP_LOGW("update", "No update found yet - press Check For Update first");
            return;
          }
          id(update_check_state) = 4;
          id(update_display).execute();
          id(perform_update).execute();
    web_server:
      sorting_group_id: grp_system
      sorting_weight: 3
  - platform: restart
    name: "Restart"
    id: web_restart
    web_server:
      sorting_group_id: grp_system
      sorting_weight: 4

# Memory watchdog for the ESP8266 (80 KB RAM total). "Free Heap" on the web page / HA should stay
# well above ~8 KB; if it drifts lower, remove entities or trim font glyphs before adding features.
debug:
  update_interval: 60s

sensor:
  - platform: debug
    free:
      name: "Free Heap"
      id: web_free_heap
      web_server:
        sorting_group_id: grp_system
        sorting_weight: 8

text_sensor:
  - platform: template
    name: "Next Prayer"
    id: web_next_prayer
    icon: "mdi:clock-outline"
    update_interval: never
    web_server:
      sorting_group_id: grp_now
      sorting_weight: 3
  - platform: template
    name: "Tick Window"
    id: web_htick_window
    icon: "mdi:bell-outline"
    update_interval: never
    web_server:
      sorting_group_id: grp_athan
      sorting_weight: 3.6
  - platform: template
    name: "Today's Times"
    id: web_today_times
    icon: "mdi:calendar-today"
    update_interval: never
    web_server:
      sorting_group_id: grp_now
      sorting_weight: 4
  - platform: template
    name: "Update Status"
    id: web_update_status
    icon: "mdi:information-outline"
    update_interval: never
    web_server:
      sorting_group_id: grp_system
      sorting_weight: 2
  - platform: debug
    reset_reason:
      name: "Reset Reason"
      id: web_reset_reason
      web_server:
        sorting_group_id: grp_system
        sorting_weight: 9
  - platform: wifi_info
    ip_address:
      name: "IP Address"
      id: web_ip
      web_server:
        sorting_group_id: grp_system
        sorting_weight: 7

# Built-in LED. Deliberately a plain output, not a `light:`: a light component saves a 42-byte colour
# record to the flash preference store (12 of its 128 words) even for an on/off LED.
output:
  - platform: gpio
    id: led_output
    pin: GPIO2
    inverted: true
  # # # for testing with RPI:
  # - platform: gpio
  #   id: gpio0_output
  #   pin: GPIO0
  #   inverted: false

http_request:
  useragent: esphome-device
  timeout: 10s
  verify_ssl: False

display:
  - platform: ssd1306_i2c
    id: oled
    model: "SSD1306 128x64"
    reset_pin: ${oled_reset_pin}
    address: 0x3C # if doesnt work change to 0x3D, its usually either 0x3C or 0x3D
    # Orientation and contrast come from the substitutions at the top of the file (shared with the
    # hot-plug re-init sequence). To rotate 180 degrees flip both x and y.
    flip_x: ${oled_flip_x}
    flip_y: ${oled_flip_y}
    contrast: ${oled_contrast}

# NOTE: on the ESP8266 every font glyph costs ~32 bytes of RAM (the glyph table lives in DRAM, only the
# bitmaps are in flash). The default glyph set is ~100 glyphs = 3.2 KB per font, so both fonts list
# exactly the characters they print. Add a character here before printing it on the OLED.
font:
  - file: "gfonts://Roboto"
    id: font1
    size: 20
    glyphs: " %,-./0123456789:>?ABCDEFGHIJKLMNOPQRSTUVWXYZ_abcdefghijklmnopqrstuvwxyz()"
  - file: "gfonts://Roboto"
    id: font2
    size: 14
    glyphs: " .0123456789acfhilnotw"   # IP address, "athan.local", "no wifi"
  - file: "gfonts://Roboto"
    id: font3
    size: 10
    glyphs: "AMP"                      # the small AM/PM tag after the time in 12-hour mode

time:
  - platform: sntp
    id: sntp_time
    timezone: "America/Los_Angeles"   # precompiled, can't be defined using lambda/variable
    on_time_sync:
      then:
        - lambda: |-
            if (!id(time_zone_changed_at_boot)) {
              ESP_LOGI("tz", "Applying persisted timezone after time sync: '%s'", id(selected_location_tz).c_str());
              id(sntp_time).set_timezone(id(selected_location_tz).c_str());
              id(sntp_time).update();
              id(time_zone_changed_at_boot) = true;
            }
        - script.execute: update_display
        - wait_until:
            timeout: 8s
            condition:
              lambda: 'return id(sntp_time).now().is_valid();'
        - lambda: |-
            id(update_display).execute();
            if (!id(prayer_times_refreshed_at_least_once)) {
              id(compute_coming_prayer).execute();
            }
    # Hourly tick: play once at 0 minute past each hour (HH:00:00). Also refresh prayer times if needed.
    on_time:
      - minutes: 0
        seconds: 0
        then:
          - script.execute: refresh_prayer_times_if_needed  # this runs before the second interval below. so if prayer time is at fixed hour, then this runs first.
          - lambda: |-
              // Hourly tick only inside the active window [start, end); start == end means all day.
              int h = id(sntp_time).now().hour;
              int s = id(htick_start_hour), e = id(htick_end_hour);
              bool in_window = (s == e) || (s < e ? (h >= s && h < e) : (h >= s || h < e));
              if (!id(athan_playing) && id(htick_file_index) > 0 && in_window) {
                  id(dfp_pending_file) = id(htick_file_index);
                  id(dfp_play).execute();
              }
      - seconds: 0
        then:
          - lambda: |-
              id(update_display).execute();
              if (!id(prayer_times_refreshed_at_least_once)){
                id(refresh_prayer_times_if_needed).execute();
              }
              return;

# ======================================================
# GLOBAL FLAGS AND VARIABLES
# ======================================================
globals:
  - id: prayer_times_refreshed_at_least_once
    type: bool
    initial_value: "false"
    restore_value: false

  - id: loaded_prayer_times_once
    type: bool
    initial_value: "false"
    restore_value: false

  - id: volume_level
    type: int
    initial_value: "50"
    restore_value: true

  - id: athan_file_index
    type: int
    initial_value: "1"
    restore_value: true
  
  - id: htick_file_index
    type: int
    initial_value: "11"
    restore_value: true

  - id: athan_enabled
    type: bool[7]
    # index = prayer index (0 Fajr, 3 Dhuhr, 4 Asr, 5 Maghrib, 6 Isha); 1 Sunrise and 2 Doha are unused
    initial_value: "{true, true, true, true, true, true, true}"
    restore_value: true

  - id: mute_index
    type: int
    initial_value: "0"
    restore_value: false

  # Physical buttons locked (child-proofing). Persisted. Unlock: web switch, or power up holding ONE button.
  - id: buttons_locked
    type: bool
    initial_value: "false"
    restore_value: true

  # Volume (0-100 %) used for the Fajr athan and the Quyam audio. -1 = not set yet: copied from
  # volume_level on the first boot after the update, then independent.
  - id: fajr_volume_level
    type: int
    initial_value: "-1"
    restore_value: true

  # Which of the ten Fajr-wording recordings (F1..F10) plays at Fajr. -1 = not set yet: copied from
  # the regular athan choice on the first boot after the update, then independent.
  - id: fajr_athan_choice
    type: int
    initial_value: "-1"
    restore_value: true
  - id: fajr_athan_index
    type: int
    initial_value: "0"
    restore_value: false

  # Hourly tick plays only when the hour is inside [start, end). start == end means all day (default).
  - id: htick_start_hour
    type: int
    initial_value: "0"
    restore_value: true
  - id: htick_end_hour
    type: int
    initial_value: "0"
    restore_value: true

  # 12-hour clock on the OLED and the web texts. Rendering only; stored times stay 24 h.
  - id: clock_12h
    type: bool
    initial_value: "false"
    restore_value: true

  # Tick Window submenu cursor: 0 Start, 1 End, 2 Done (not persisted)
  - id: tickwin_index
    type: int
    initial_value: "0"
    restore_value: false

  - id: athan_playing
    type: bool
    initial_value: "false"
    restore_value: false

  - id: ui_mode
    type: int
    initial_value: "0"
    restore_value: false

  - id: ui_menu_index
    type: int
    initial_value: "0"
    restore_value: false

  - id: athan_index
    type: int
    initial_value: "0"
    restore_value: false

  - id: htick_index
    type: int
    initial_value: "0"
    restore_value: false

  - id: location_index
    type: int
    initial_value: "0"
    restore_value: false

  - id: selected_location_index
    type: int
    initial_value: "0"
    restore_value: true

  - id: selected_location_tz
    type: std::string
    initial_value: '"America/Los_Angeles"'
    restore_value: true
    max_restore_data_length: 47   # POSIX TZ strings are 22-35 chars; 48 bytes = 13 flash words (63 would be 17)

  - id: time_zone_changed_at_boot
    type: bool
    initial_value: "false"
    restore_value: false

  - id: ui_last_activity
    type: int
    initial_value: "0"
    restore_value: false

  - id: current_athan_prayer_index
    type: int
    initial_value: "0"
    restore_value: false

  - id: prayer_hours
    type: uint8_t[7]        # 0..23; uint8_t[7] costs 3 flash words, int[7] would cost 8
    initial_value: "{5, 6, 7, 12, 15, 17, 18}"   # fajr, shrouk, doha, dhuhr, asr, maghrib, isha
    restore_value: true
  - id: prayer_minutes
    type: uint8_t[7]        # 0..59
    initial_value: "{42, 13, 39, 15, 47, 12, 28}"
    restore_value: true
  - id: prayer_times_day
    type: int
    initial_value: "0"
    restore_value: true
  - id: prayer_times_year
    type: int
    initial_value: "0"
    restore_value: true

  - id: next_prayer_index
    type: int
    initial_value: "0"
    restore_value: false   # recomputed from the schedule at every boot; not worth 2 flash words
    
  - id: next_prayer_hour
    type: int
    initial_value: "0"
    restore_value: false   # recomputed from the schedule at every boot; not worth 2 flash words
  - id: next_prayer_minute
    type: int
    initial_value: "0"
    restore_value: false   # recomputed from the schedule at every boot; not worth 2 flash words
  - id: quyam_next_hour
    type: int
    initial_value: "0"
    restore_value: false   # recomputed from the schedule at every boot; not worth 2 flash words
  - id: quyam_next_minute
    type: int
    initial_value: "0"
    restore_value: false   # recomputed from the schedule at every boot; not worth 2 flash words
  - id: quyam_triggered
    type: bool
    initial_value: "false"
    restore_value: false
  - id: q_flag
    type: bool
    initial_value: "false"
    restore_value: true

  - id: q_select_count
    type: int
    initial_value: "0"
    restore_value: false
  - id: update_latest_version
    type: int
    initial_value: "0"
    restore_value: false
  - id: update_check_state
    type: int
    initial_value: "0"
    restore_value: false

  - id: update_url
    type: std::string
    initial_value: "\"\""
    restore_value: false

  - id: dfp_pending_file
    type: int
    initial_value: "0"
    restore_value: false


script:
  - id: refresh_prayer_times_if_needed
    mode: restart
    then:
      - lambda: |-
          auto now = id(sntp_time).now();
          if (!now.is_valid()) {
           return;
          }
          if (!id(loaded_prayer_times_once)) {
            ESP_LOGI("prayer","Prayer times never loaded yet — loading now");
            id(load_prayer_times).execute();
          }
          int current_day = now.day_of_year;
          int current_year = now.year;
          if (id(prayer_times_day) != current_day || id(prayer_times_year) != current_year) {
            ESP_LOGI("prayer","Prayer times are outdated, reloading...");
            id(loaded_prayer_times_once) = false;
            id(prayer_times_refreshed_at_least_once) = false;
            id(load_prayer_times).execute();
          } else {
            id(prayer_times_refreshed_at_least_once) = true;
          }
          id(compute_coming_prayer).execute();
          id(log_prayers).execute();
          id(update_display).execute();
  # Stop whatever the DFPlayer is doing (athan, preview, tick). Shared by both buttons and the web page.
  - id: silence_audio
    mode: restart
    then:
      - lambda: |-
          id(web_preview).stop();
          id(dfp).stop();
          id(dfp_play).stop();
          if (id(athan_playing)) {
            ESP_LOGI("audio", "Athan silenced");
          }
          id(athan_playing) = false;
          if (id(ui_mode) != 8 && id(ui_mode) != 9) id(apply_volume).execute();
          id(update_display).execute();

  # Map volume_level (0-100 %) to the DFPlayer range (0-30) and apply it. Used at boot, by the Volume menu and by the web slider.
  - id: apply_volume
    mode: restart
    then:
      - lambda: |-
          int v = id(volume_level);
          if (v < 0) v = 0; if (v > 100) v = 100;
          id(volume_level) = v;
          int vol = (v * 30 + 50) / 100;
          if (vol < 0) vol = 0; if (vol > 30) vol = 30;
          id(dfp).set_volume(vol);
          ESP_LOGI("audio", "DFPlayer volume set to %d (from %d%%)", vol, v);

  # Same mapping as apply_volume but for fajr_volume_level: used for the Fajr athan and the Quyam audio.
  - id: apply_fajr_volume
    mode: restart
    then:
      - lambda: |-
          int v = id(fajr_volume_level);
          if (v < 0) v = id(volume_level);
          if (v > 100) v = 100;
          int vol = (v * 30 + 50) / 100;
          if (vol < 0) vol = 0; if (vol > 30) vol = 30;
          id(dfp).set_volume(vol);
          ESP_LOGI("audio", "DFPlayer volume set to %d (Fajr level %d%%)", vol, v);

  # Web slider feedback: play the volume tone at the Fajr level, then go back to the main volume.
  - id: fajr_volume_feedback
    mode: restart
    then:
      - if:
          condition:
            lambda: 'return !id(athan_playing);'
          then:
            - script.execute: apply_fajr_volume
            - lambda: |-
                id(dfp_pending_file) = ${tone_volume_file};
                id(dfp_play).execute();
            - delay: 1500ms
            - if:
                condition:
                  lambda: 'return !id(athan_playing) && id(ui_mode) != 9;'
                then:
                  - script.execute: apply_volume

  # DFPlayer recovery over serial: reset command, wait for the module to come back, stop, main volume.
  # Not wired to anything yet (no web button, no menu item): the clones only recover from a power
  # cycle, so replugging is the practical fix today. Kept for the next PCB, where the module's BUSY pin
  # reaches a GPIO (see todo.md): then a watchdog can call this when BUSY contradicts what was requested.
  - id: dfp_recover
    mode: single
    then:
      - lambda: |-
          id(web_preview).stop();
          id(dfp_play).stop();
          id(athan_playing) = false;
          ESP_LOGW("audio", "DFPlayer reset requested");
          id(dfp).reset();
      - delay: 2500ms
      - lambda: 'id(dfp).stop();'
      - delay: 300ms
      - script.execute: apply_volume
      - lambda: 'id(update_display).execute();'

  # Web-page preview: play dfp_pending_file for 20 s, then stop (unless a real athan started meanwhile).
  - id: web_preview
    mode: restart
    then:
      - if:
          condition:
            lambda: 'return !id(athan_playing) && id(dfp_pending_file) > 0;'
          then:
            - lambda: 'ESP_LOGI("web", "Preview of file %d for 20s", id(dfp_pending_file));'
            - script.execute: dfp_play
            - delay: 20s
            - lambda: |-
                if (!id(athan_playing)) {
                  id(dfp).stop();
                  id(dfp_play).stop();
                  if (id(ui_mode) != 8 && id(ui_mode) != 9) id(apply_volume).execute();   // a Fajr preview ran at the Fajr volume
                  ESP_LOGI("web", "Preview finished");
                }

  - id: make_athan
    mode: single
    then:
      - logger.log: "Athan Calling!"
      - lambda: |-
          id(athan_playing) = true;
          id(web_preview).stop();
          id(dfp).stop();
          id(dfp_play).stop();
      - delay: 150ms
      - if:
          condition:
            lambda: 'return id(current_athan_prayer_index) == 0;'
          then:
            - script.execute: apply_fajr_volume
          else:
            - script.execute: apply_volume
      - delay: 100ms              # clones need a gap between the volume command and play (once per athan, inaudible)
      - lambda: |-
          int choice = id(athan_file_index) - (${athan_file_first} - 1);   // regular choice 1..10
          int fajr_choice = id(fajr_athan_choice);                            // Fajr choice 1..10, its own setting
          if (fajr_choice < 1 || fajr_choice > 10) fajr_choice = choice;
          int f = (id(current_athan_prayer_index) == 0)
                    ? (${fajr_file_first} - 1) + fajr_choice   // Fajr wording (F<fajr_choice>)
                    : (${athan_file_first} - 1) + choice;      // regular wording (A<choice>)
          ESP_LOGI("athan", "Playing file %d (prayer index %d, regular choice %d, fajr choice %d)", f, id(current_athan_prayer_index), choice, fajr_choice);
          id(dfp).play_file(f);
      - output.turn_on: led_output
      - delay: 5min
      - output.turn_off: led_output
      - lambda: |-
          id(athan_playing) = false;
      - script.execute: apply_volume

  - id: perform_update
    mode: single
    then:
      - lambda: |-
          // If we don't have a cached update URL, fail immediately
          if (id(update_url).empty()) {
            ESP_LOGE("update", "No update_url cached, aborting perform_update");
            id(update_check_state) = 0;
            id(update_display).execute();
            id(ui_mode) = 0;
            return;
          }
          // indicate attempting state while OTA runs
          id(update_check_state) = 4;
          id(update_display).execute();
      - ota.http_request.flash:
          url: !lambda |-
            std::string base = id(update_url);
            return  base + ".bin";
          md5_url: !lambda |-
            std::string base = id(update_url);
            return base + ".md5";
      - lambda: |-
          // Clear attempting state after OTA attempt so menu doesn't remain showing "attempting .."
          id(update_check_state) = 0;
          id(ui_mode) = 0;
          id(update_display).execute();

  - id: dfp_play
    mode: restart
    then:
      - delay: 20ms
      - lambda: |-
          int f = id(dfp_pending_file);
          if (f > 0) {
            id(dfp).play_file(f);
            ESP_LOGD("dfp", "Playing file %d (debounced)", f);
          }

  - id: test_script
    mode: single
    then:
      - lambda: |-
          //ESP_LOGI("test","Waving from test..");
          return;
  - id: check_update_remote
    mode: single
    then:
      - logger.log: "Starting remote update check"
      - http_request.get:
          url: "http://rawcdn.githack.com/et7ad/esp_athan/master/docs/firmwareinfo/latest.json"
          capture_response: false
          max_response_buffer_size: 1024
          on_response:
            then:
              - lambda: |-
                  ESP_LOGI("update", "Reading latest.json response...");
                  std::string json_text;
                  char buf[128];
                  int len;
                  int total_bytes = 0;
                  const int max_bytes = 1024;
                  while ((len = response->read((uint8_t*)buf, sizeof(buf))) > 0) {
                    if (total_bytes + len > max_bytes) len = max_bytes - total_bytes;
                    json_text.append(buf, len);
                    total_bytes += len;
                    if (total_bytes >= max_bytes) break;
                  }

                  if (total_bytes == 0) {
                    ESP_LOGE("update", "Empty latest.json response");
                    id(update_check_state) = 0;
                    id(update_display).execute();
                    return;
                  }

                  int start = json_text.find('{');
                  if (start > 0) json_text.erase(0, start);
                  int end = json_text.rfind('}');
                  if (end != -1 && end + 1 < json_text.size()) json_text.erase(end + 1);

                  JsonDocument doc;
                  auto err = deserializeJson(doc, json_text);
                  if (err) {
                    ESP_LOGE("update", "JSON parse failed: %s", err.c_str());
                    id(update_check_state) = 0;
                    id(update_display).execute();
                    return;
                  }

                  if (!doc["latest_version"].is<int>()) {
                    ESP_LOGE("update", "latest_version missing or not an int in JSON");
                    id(update_check_state) = 0;
                    id(update_display).execute();
                    return;
                  }

                  int latest = doc["latest_version"].as<int>();
                  id(update_latest_version) = latest;
                  if (latest <= ${current_version}) {
                    id(update_check_state) = 1; // up-to-date
                    ESP_LOGI("update", "Device up-to-date: %d", latest);
                    id(update_display).execute();
                    return;
                  }
                  // Attempt to read optional firmware URL field
                  std::string fw_url;
                  if (!doc["url"].is<const char*>()) {
                    ESP_LOGE("update", "No url provided in latest.json");
                    id(update_check_state) = 0;
                    id(update_display).execute();
                    id(ui_mode) = 0;
                    return;
                  }
                  fw_url = doc["url"].as<const char*>();
                  if (fw_url.empty()) {
                    ESP_LOGE("update", "Empty url in latest.json");
                    id(update_check_state) = 0;
                    id(update_display).execute();
                    id(ui_mode) = 0;
                    return;
                  }
                  id(update_url) = fw_url;
                  id(update_check_state) = 2; // update available
                  ESP_LOGI("update", "Update available: %d -> %d, url=%s", ${current_version}, latest, fw_url.c_str());
                  id(update_display).execute();
  - id: run_quyam
    mode: single
    then:
      - lambda: 'id(quyam_triggered) = true;'
      - if:
          condition:
            lambda: 'return id(q_flag);'
          then:
            - logger.log: "Quyam starting (Q flag is ON)"
            - switch.turn_on: external_relay
            - script.execute: apply_fajr_volume
            - lambda: |-
                id(dfp_pending_file) = random(${quyam_file_first}, ${quyam_file_last} + 1);
                id(dfp_play).execute();
            - delay: 15min
            - switch.turn_off: external_relay
            - if:
                condition:
                  lambda: 'return !id(athan_playing);'
                then:
                  - script.execute: apply_volume
            
          else:
            - logger.log: "Q flag is OFF — skipping Quyam actions"


  - id: change_location_handler
    mode: single
    then:
      - logger.log: "Attempting to fetch timezone for previewed location"
      - http_request.get:
          url: !lambda |-
            char u[256];
            int li = id(location_index);
            if (li < 0 || li >= (int) id(web_location_select).size()) li = 0;
            auto loc = id(web_location_select).at(li);   // key list lives in the Location select options
            const char* key = loc.has_value() ? loc.value().c_str() : "davis";
            snprintf(u, sizeof(u),
              "http://rawcdn.githack.com/et7ad/esp_athan/master/docs/timezones/%s.json",
              key);
            ESP_LOGI("tz", "TZ URL = %s", u);
            return std::string(u);
          capture_response: false
          max_response_buffer_size: 512
          on_response:
            then:
              - lambda: |-
                  ESP_LOGI("tz", "Reading timezone response...");

                  std::string json_text;
                  char buf[128];
                  int len;
                  int total_bytes = 0;
                  const int max_bytes = 512;

                  while ((len = response->read((uint8_t*)buf, sizeof(buf))) > 0) {
                    if (total_bytes + len > max_bytes) len = max_bytes - total_bytes;
                    json_text.append(buf, len);
                    total_bytes += len;
                    if (total_bytes >= max_bytes) break;
                  }

                  if (total_bytes == 0) {
                    ESP_LOGE("tz", "Empty timezone response");
                    if (id(ui_mode) == 4) id(ui_mode) = 0;
                    id(update_display).execute();
                    return;
                  }

                  int start = json_text.find('{');
                  if (start > 0) json_text.erase(0, start);
                  int end = json_text.rfind('}');
                  if (end != -1 && end + 1 < json_text.size()) json_text.erase(end + 1);

                  JsonDocument doc;
                  auto err = deserializeJson(doc, json_text);
                  if (err) {
                    ESP_LOGE("tz", "JSON parse failed: %s", err.c_str());
                    if (id(ui_mode) == 4) id(ui_mode) = 0;
                    id(update_display).execute();
                    return;
                  }

                  if (!doc["TZ"].is<const char*>()) {
                    ESP_LOGE("tz", "TZ key missing or invalid");
                    if (id(ui_mode) == 4) id(ui_mode) = 0;
                    id(update_display).execute();
                    return;
                  }

                  std::string tz(doc["TZ"].as<const char*>());
                  if (tz.size() == 0) {
                    ESP_LOGE("tz", "TZ value empty");
                    if (id(ui_mode) == 4) id(ui_mode) = 0;
                    id(update_display).execute();
                    return;
                  }

                  // success: apply new timezone value and update selected index
                  id(selected_location_tz) = tz;
                  // Set system/ESP timezone immediately so SNTP/time functions use it
                  ESP_LOGI("tz", "Setting system timezone to '%s'", id(selected_location_tz).c_str());
                  id(sntp_time).set_timezone(id(selected_location_tz).c_str());
                  id(sntp_time).update();
                  id(selected_location_index) = id(location_index);
                  id(prayer_times_day) = -1;
                  id(loaded_prayer_times_once) = false;
                  id(prayer_times_refreshed_at_least_once) = false;
                  id(refresh_prayer_times_if_needed).execute();
                  ESP_LOGI("tz", "Applied new timezone '%s' and location index %d", tz.c_str(), id(selected_location_index));
                  id(update_display).execute();
      - lambda: |-
          if (id(ui_mode) == 4) id(ui_mode) = 0;
          id(update_display).execute();

  - id: load_prayer_times
    mode: restart
    then:
      - http_request.get:
          url: !lambda |-
            auto now = id(sntp_time).now();
            int year = now.year;
            int day  = now.day_of_year;

            char u[256];
            int li = id(selected_location_index);
            if (li < 0 || li >= (int) id(web_location_select).size()) li = 0;
            auto loc = id(web_location_select).at(li);   // key list lives in the Location select options
            const char* key = loc.has_value() ? loc.value().c_str() : "davis";
            snprintf(u, sizeof(u),
              "http://rawcdn.githack.com/et7ad/esp_athan/master/docs/athantimes/%s/%d/%03d.json",
              key, year, day);

            ESP_LOGI("prayer", "URL = %s", u);
            return std::string(u);
          capture_response: false
          max_response_buffer_size: 4096
          on_response:
            then:
              - lambda: |-
                  ESP_LOGI("prayer", "Reading response safely...");

                  std::string json_text;
                  char buf[128];
                  int len;
                  int total_bytes = 0;
                  const int max_bytes = 4096;  // safety limit

                  // Loop until no more data or max_bytes reached
                  while ((len = response->read((uint8_t*)buf, sizeof(buf))) > 0) {
                    // Append only up to max_bytes
                    if (total_bytes + len > max_bytes) {
                      len = max_bytes - total_bytes;
                    }
                    json_text.append(buf, len);
                    total_bytes += len;

                    if (total_bytes >= max_bytes) {
                      ESP_LOGW("prayer", "Reached max read bytes (%d), stopping", max_bytes);
                      break;
                    }
                  }

                  ESP_LOGI("prayer", "JSON size = %d bytes", total_bytes);

                  if (total_bytes == 0) {
                    ESP_LOGE("prayer", "No data received, skipping parse");
                    return;
                  }

                  // Strip everything before the first '{'
                  int start = json_text.find('{');
                  if (start > 0) json_text.erase(0, start);

                  // Strip everything after the last '}'
                  int end = json_text.rfind('}');
                  if (end != -1 && end + 1 < json_text.size())
                    json_text.erase(end + 1);
                  
                  JsonDocument doc;  // adjust size if needed
                  auto err = deserializeJson(doc, json_text);
                  if (err) {
                    ESP_LOGE("prayer", "JSON parse failed: %s", err.c_str());
                    return;
                  }

                  // Fajr (always AM)
                  {
                    std::string s(doc["fajr"].as<const char*>());  // "06:06 "
                    s.erase(std::remove(s.begin(), s.end(), ' '), s.end());
                    int h = std::stoi(s.substr(0,2));
                    int m = std::stoi(s.substr(3,2));
                    id(prayer_hours)[0] = h;    // Fajr hour
                    id(prayer_minutes)[0] = m;  // Fajr minute
                  }

                  // Shrouk (always AM)
                  {
                    std::string s(doc["sunrise"].as<const char*>());
                    s.erase(std::remove(s.begin(), s.end(), ' '), s.end());
                    int h = std::stoi(s.substr(0,2));
                    int m = std::stoi(s.substr(3,2));
                    id(prayer_hours)[1] = h;
                    id(prayer_minutes)[1] = m;
                  }

                  // Doha (always AM) -- inserted after Sunrise; this is exempt from making athan
                  {
                    std::string s(doc["doha"].as<const char*>());
                    s.erase(std::remove(s.begin(), s.end(), ' '), s.end());
                    int h = std::stoi(s.substr(0,2));
                    int m = std::stoi(s.substr(3,2));
                    id(prayer_hours)[2] = h;
                    id(prayer_minutes)[2] = m;
                  }

                  // Dhuhr (special logic: PM if hour < 9, AM if hour > 9)
                  {
                    std::string s(doc["dhuhar"].as<const char*>());
                    s.erase(std::remove(s.begin(), s.end(), ' '), s.end());
                    int h = std::stoi(s.substr(0,2));
                    int m = std::stoi(s.substr(3,2));
                    if (h < 9) h += 12;  // PM adjustment
                    id(prayer_hours)[3] = h;
                    id(prayer_minutes)[3] = m;
                  }

                  // Asr (always PM)
                  {
                    std::string s(doc["asr"].as<const char*>());
                    s.erase(std::remove(s.begin(), s.end(), ' '), s.end());
                    int h = std::stoi(s.substr(0,2));
                    int m = std::stoi(s.substr(3,2));
                    if (h < 12) h += 12;
                    id(prayer_hours)[4] = h;
                    id(prayer_minutes)[4] = m;
                  }

                  // Maghrib (always PM)
                  {
                    std::string s(doc["maghrib"].as<const char*>());
                    s.erase(std::remove(s.begin(), s.end(), ' '), s.end());
                    int h = std::stoi(s.substr(0,2));
                    int m = std::stoi(s.substr(3,2));
                    if (h < 12) h += 12;
                    id(prayer_hours)[5] = h;
                    id(prayer_minutes)[5] = m;
                  }

                  // Isha (always PM)
                  {
                    std::string s(doc["isha"].as<const char*>());
                    s.erase(std::remove(s.begin(), s.end(), ' '), s.end());
                    int h = std::stoi(s.substr(0,2));
                    int m = std::stoi(s.substr(3,2));
                    if (h < 12) h += 12;
                    id(prayer_hours)[6] = h;
                    id(prayer_minutes)[6] = m;
                  }

                  auto now = id(sntp_time).now();
                  id(prayer_times_day) = now.day_of_year;
                  id(prayer_times_year) = now.year;

                  ESP_LOGI("prayer", "prayer times loaded from json");
                  id(log_prayers).execute();
                  // Indicate that prayer times were successfully loaded at least once
                  id(loaded_prayer_times_once) = true;
                  ESP_LOGI("prayer", "loaded_prayer_times_once = true");
  - id: log_prayers
    mode: restart
    then:
      - lambda: |-
          ESP_LOGI("prayer","Prayer times for today:");
          ESP_LOGI("prayer","Fajr: %02d:%02d", id(prayer_hours)[0], id(prayer_minutes)[0]);
          ESP_LOGI("prayer","Shrouk: %02d:%02d", id(prayer_hours)[1], id(prayer_minutes)[1]);
          ESP_LOGI("prayer","Doha: %02d:%02d", id(prayer_hours)[2], id(prayer_minutes)[2]);
          ESP_LOGI("prayer","Dhuhr: %02d:%02d", id(prayer_hours)[3], id(prayer_minutes)[3]);
          ESP_LOGI("prayer","Asr: %02d:%02d", id(prayer_hours)[4], id(prayer_minutes)[4]);
          ESP_LOGI("prayer","Maghrib: %02d:%02d", id(prayer_hours)[5], id(prayer_minutes)[5]);
